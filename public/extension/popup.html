<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 280px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0b0f14;
        color: #e6edf3;
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #8b98a5;
        line-height: 1.5;
        margin: 0 0 12px;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: #37d67a;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span>Lovable Copilot</h1>
    <p>
      Abra um projeto em <b>lovable.dev</b>. O painel flutuante aparece no canto inferior direito —
      clique no botão de ligar para ativar.
    </p>
    <p>Configure o token do GitHub e as chaves de IA dentro do painel, em Ajustes.</p>
  </body>
</html>
